# ===== COMMIT 1: App + PostgreSQL + pgAdmin + Nginx =====
name: library

services:
  db:
    image: postgres:16-alpine
    container_name: library-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      POSTGRES_DB: library
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]          # KHÔNG publish port ra host
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER} -d library"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: ./app
    container_name: library-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: library
      DB_USER: ${APP_DB_USER}
      DB_PASSWORD: ${APP_DB_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: library-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "127.0.0.1:5050:80"      # chỉ truy cập từ máy local
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db: { condition: service_healthy }
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine   # chạy non-root
    container_name: library-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP -> redirect HTTPS
      - "8443:8443"   # HTTPS
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on: [app]
    networks: [frontend, backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  frontend: {}
  backend:
    internal: true     # network cô lập, không ra Internet

volumes:
  pgdata:
  pgadmin_data:
