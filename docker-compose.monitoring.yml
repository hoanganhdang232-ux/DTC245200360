# ===== COMMIT 2: Prometheus + Grafana + exporters =====
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: library-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: library-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus]
    networks: [frontend, backend]
    security_opt: ["no-new-privileges:true"]

  cadvisor:
    # Bản mới hỗ trợ tốt hơn Docker Desktop/WSL2 (gắn label "name" cho container)
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: library-cadvisor
    restart: unless-stopped
    privileged: true            # cAdvisor cần đọc cgroup của host (chỉ mạng backend, không publish port)
    command:
      - --docker_only=true      # chỉ theo dõi container Docker, bỏ cgroup hệ thống
      - --housekeeping_interval=10s
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [backend]

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: library-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: db:5432/library?sslmode=disable
      DATA_SOURCE_USER: exporter
      DATA_SOURCE_PASS: ${EXPORTER_DB_PASSWORD}
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: library-nginx-exporter
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://nginx:8081/stub_status"]
    depends_on: [nginx]
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

volumes:
  prometheus_data:
  grafana_data:
