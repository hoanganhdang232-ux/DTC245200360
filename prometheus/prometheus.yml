global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ['localhost:9090'] }]
  - job_name: cadvisor          # metrics container
    static_configs: [{ targets: ['cadvisor:8080'] }]
  - job_name: nginx             # metrics web server
    static_configs: [{ targets: ['nginx-exporter:9113'] }]
  - job_name: postgres          # metrics database
    static_configs: [{ targets: ['postgres-exporter:9187'] }]
  - job_name: app               # metrics ứng dụng Node.js
    metrics_path: /metrics
    static_configs: [{ targets: ['app:3000'] }]
