# Nginx (unprivileged, non-root) - reverse proxy + HTTPS tự ký + security headers
limit_req_zone $binary_remote_addr zone=perip:10m rate=20r/s;
server_tokens off;

# Chuyển HTTP -> HTTPS
server {
    listen 8080;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

    client_max_body_size 1m;

    # Không public metrics ra ngoài
    location = /metrics { return 404; }

    location / {
        limit_req zone=perip burst=40 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Endpoint nội bộ cho nginx-exporter (chỉ truy cập được trong network backend)
server {
    listen 8081;
    location = /stub_status {
        stub_status;
        access_log off;
    }
}
